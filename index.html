<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brainrot Cases</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:Arial;text-align:center;background:radial-gradient(circle at 20% 20%,#7c3aed,transparent 30%),radial-gradient(circle at 80% 70%,#ec4899,transparent 30%),linear-gradient(135deg,#08000f,#18002d,#030006)}
h1{font-size:40px;margin:35px 0 8px;text-shadow:0 0 25px #a855f7}
.sub{color:#c4b5fd}
.bal{display:inline-block;margin:20px;padding:12px 25px;border-radius:30px;background:#ffffff15;border:1px solid #ffffff30;font-size:20px}
.coin{color:#facc15}
.cases{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;padding:15px}
.case{width:290px;padding:25px;border-radius:25px;background:#ffffff12;border:1px solid #ffffff30;box-shadow:0 15px 50px #0008}
.icon{font-size:80px}
.case p{color:#c4b5fd}
button{border:0;border-radius:14px;padding:14px 20px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.open{width:100%;background:linear-gradient(90deg,#7c3aed,#ec4899)}
.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.win{width:100%;max-width:850px;padding:25px;border-radius:25px;background:#140021;border:1px solid #ffffff30}
.roll{height:145px;overflow:hidden;position:relative;background:#030006;border:2px solid #ffffff25;border-radius:18px}
.pointer{
