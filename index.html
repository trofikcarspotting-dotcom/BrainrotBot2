<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brainrot Case</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #7c3aed55, transparent 30%),
        radial-gradient(circle at 80% 70%, #ec489955, transparent 30%),
        linear-gradient(135deg, #090014, #16002b, #05000c);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px);
    background-size: 45px 45px;
    opacity: .12;
    pointer-events: none;
}

.container {
    width: 95%;
    max-width: 1000px;
    margin: auto;
    text-align: center;
    position: relative;
    z-index: 2;
}

header {
    padding: 35px 10px 20px;
}

h1 {
    font-size: 42px;
    margin: 0;
    text-shadow: 0 0 25px #a855f7;
}

.subtitle {
    color: #c4b5fd;
    margin-top: 10px;
}

.balance {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 30px;
    background: #ffffff12;
    border: 1px solid #ffffff25;
    box-shadow: 0 0 25px #0008;
    font-size: 20px;
}

.coin {
    color: #facc15;
}

/* CASES */

.cases {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    margin-top: 35px;
}

.case {
    width: 280px;
    padding: 25px;
    border-radius: 25px;
    background: linear-gradient(145deg, #ffffff15, #ffffff05);
    border: 1px solid #ffffff25;
    box-shadow: 0 15px 50px #0008;
    backdrop-filter: blur(10px);
    transition: .3s;
}

.case:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 60px #9333ea66;
}

.case-icon {
    font-size: 85px;
    margin: 10px;
    filter: drop-shadow(0 0 15px #a855f7);
}

.case h2 {
    margin-bottom: 5px;
}

.case p {
    color: #c4b5fd;
}

.open {
    width: 100%;
    border: 0;
    padding: 14px;
    margin-top: 15px;
    border-radius: 15px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg, #7c3aed, #ec4899);
    box-shadow: 0 0 20px #9333ea66;
    transition: .2s;
}

.open:hover {
    transform: scale(1.04);
}

.open:active {
    transform: scale(.97);
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #000b;
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal.show {
    display: flex;
}

.window {
    width: 95%;
    max-width: 850px;
    background: linear-gradient(145deg, #18002d, #090014);
    border: 1px solid #ffffff30;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 0 80px #7c3aed66;
}

.window h2 {
    margin-top: 0;
}
